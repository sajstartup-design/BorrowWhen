<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport"
         content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
      <meta name="robots" content="noindex, nofollow" />
      <title>Borrowhen | Dashboard</title>
      <!-- Favicon -->
      <link rel="icon" type="image/x-icon" th:href="@{/assets/logo.ico}" />
      <!-- Fonts -->
      <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <!-- Icons + CSS -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <link rel="stylesheet" th:href="@{/css/style.css}" />
      <link rel="stylesheet" th:href="@{/css/output.css}" />
   </head>
   <body>
      <div class="bg-base-200 flex min-h-screen flex-col">
         <div th:replace="~{header :: admin-header}"></div>
         <main class="flex-1 relative">
            <div class="absolute top-0 left-0 w-full h-105 bg-blue-500 z-0">			
            </div>
            <div class="relative z-10 px-6 max-w-[1280px] mx-auto w-full gap-y-3">
               <div class="flex flex-wrap items-center justify-between">
                  <div class="max-w-auto overflow-x-auto">
                     <ul class="py-3 flex items-center text-white">
                        <li>
                           <a th:href="@{/admin/dashboard}" class="px-2 text-xs flex items-center gap-2">
                           <i class="fa-solid fa-house inline-flex items-center"></i>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a th:href="@{/admin/dashboard}" class="px-2 text-xs flex items-center gap-2">
                           <span>Borrowhen</span>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a th:href="@{/admin/inventory}" class="px-2 text-xs flex items-center gap-2 "	>
                           <span>Inventory List</span>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a href="#" class="px-2 text-xs flex items-center gap-2 font-bold">
                           <span>Add Item</span>
                           </a>
                        </li>
                     </ul>
                  </div>
               </div>
               <hr class="border-t border-white opacity-80" />
               <div class="flex">
                  <div class="flex items-center py-4 gap-3">
                     <div class="text-base rounded-md bg-white w-10 h-10 flex items-center justify-center">
                        <i class="fa-solid fa-chart-pie text-2xl text-blue-500" ></i>
                     </div>
                     <div class="flex flex-col gap-0 text-white">
                        <span class="text-lg font-bold">Add Item</span>
                     </div>
                  </div>
               </div>
               <!-- ---------- FORM ---------- -->
               <div class="bg-white rounded-md ">
                  <div class="bg-base-100 rounded-xl p-6 shadow-md flex flex-col gap-6">
                     <form th:action="@{/admin/inventory/create}" method="POST" enctype="multipart/form-data">
                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                           <!-- LEFT SIDE — BASIC INFORMATION -->
                           <div class="xl:col-span-2 space-y-6">
                              <div class="border border-gray-200 rounded-lg p-5 shadow-md">
                                 <h2 class="text-lg font-semibold text-gray-800 mb-4">Item Information</h2>
                                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemName">Item Name</label>
                                       <input id="itemName" type="text" name="itemName" placeholder="Enter item name" required
                                          class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                    </div>
                                    <div class="input-wrapper mb-3">
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="category">Category</label>
                                       <select class="dropdown w-full border border-gray-300 rounded-md h-8 text-sm" name="category">
                                            <option value="">Select Category</option>
											<option value="Electronics">Electronics</option>
											<option value="Tools & Equipment">Tools & Equipment</option>
											<option value="Sports & Outdoor">Sports & Outdoor</option>
											<option value="Appliances">Appliances</option>
											<option value="Furniture">Furniture</option>
											<option value="Books & Learning Materials">Books & Learning Materials</option>
											<option value="Office Supplies">Office Supplies</option>
											<option value="Musical Instruments">Musical Instruments</option>
											<option value="Clothing & Costumes">Clothing & Costumes</option>
											<option value="Emergency Equipment">Emergency Equipment</option>
											<option value="School Materials">School Materials</option>
											<option value="Cleaning Equipment">Cleaning Equipment</option>
											<option value="Others">Others</option>
                                       </select>
                                    </div>
                                    <div class="input-wrapper mb-3">
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemPrice">Lender</label>
                                       <select class="dropdown w-full border border-gray-300 rounded-md h-8 text-sm" name="userId">
                                          <option value="">Select Lender</option>
                                          <option th:each="userId : ${allUserId}" th:value="${userId}" th:text="${userId}"></option>
                                       </select>
                                    </div>
                                    <div>
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemPrice">Price</label>
                                       <input id="itemPrice" type="text" name="price" placeholder="100.00" required
                                          class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                    </div>
                                    <div>
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemQty">Total Qty</label>
                                       <input id="itemQty" type="text" name="totalQty" placeholder="10" required
                                          class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                    </div>
                                    <div class="input-wrapper mb-3">
								        <label class="block text-sm font-medium text-gray-600 mb-1">Item Image</label>
								        <input 
								            type="file" 
								            accept="image/*" 
								            onchange="previewImage(event)" 
								            name="image"
								            class="border border-gray-300 rounded-md p-1 w-full text-sm"
								        >
								    </div>
                                 </div>
                              </div>
                           </div>
                           <!-- RIGHT SIDE — PREVIEW -->
                           <div class="space-y-6">
                              <div class="border border-gray-200 rounded-lg p-5 shadow-md">
                                 <h2 class="text-lg font-semibold text-gray-800 mb-4">Item Information Preview</h2>
                                 <div class="space-y-3 text-sm text-gray-600">
                                    <p><span class="font-medium">Item:</span> <span id="previewName">—</span></p>
                                    <p><span class="font-medium">Category:</span> <span id="previewCategory">—</span></p>
                                    <p><span class="font-medium">Lender:</span> <span id="previewLender">—</span></p>
                                    <p><span class="font-medium">Price:</span> <span id="previewPrice">—</span></p>
                                    <p><span class="font-medium">Total Qty:</span> <span id="previewQty">—</span></p>
                                    <div class="mt-4">
							            <span class="font-medium text-gray-700 block mb-1">Image:</span>
										<img id="previewImageBox" class="object-contain rounded-md border bg-gray-50 hidden" />
							        </div>
                                 </div>
                              </div>
                              <!-- Buttons -->
                              <div class="flex items-center justify-end gap-3">
                                 <a th:href="@{/lender/inventory}"
                                    class="h-8 px-2 py-1 rounded-md border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">
                                 Cancel
                                 </a>
                                 <button type="submit"
                                    class="h-8 px-2 py-1 rounded-md bg-blue-500 text-white text-sm hover:bg-indigo-700 transition shadow-md">
                                 <i class="fa-solid fa-check mr-2"></i>Add Item
                                 </button>
                              </div>
                           </div>
                        </div>
                     </form>
                  </div>
               </div>
               <footer th:replace="~{footer :: footer}"></footer>
            </div>
         </main>
      </div>
      <script th:src="@{/script/dropdown.js}"></script>
      <!-- ✅ FIXED SCRIPT -->
      <script>
document.addEventListener("DOMContentLoaded", () => {

    const inputs = {
        name: document.getElementById("itemName"),
        price: document.getElementById("itemPrice"),
        qty: document.getElementById("itemQty")
    };

    const preview = {
        name: document.getElementById("previewName"),
        category: document.getElementById("previewCategory"),
        lender: document.getElementById("previewLender"),
        price: document.getElementById("previewPrice"),
        qty: document.getElementById("previewQty")
    };

    const lenderSelect = document.querySelector("select[name='userId']");
    const categorySelect = document.querySelector("select[name='category']");

    // ------------------ UPDATE PREVIEW ------------------
    function updatePreview() {
        // Name
        preview.name.textContent = inputs.name.value || "—";

        // Category
        preview.category.textContent =
            categorySelect.value !== "" ? categorySelect.value : "—";

        // Lender
        const lenderText = lenderSelect.value ? lenderSelect.value : "—";
        preview.lender.textContent = lenderText;

        // Price
        let priceVal = inputs.price.value.replace(/[^\d.]/g, "");
        inputs.price.value = priceVal;
        preview.price.textContent = priceVal ? `₱ ${priceVal}` : "—";

        // Qty
        let qtyVal = inputs.qty.value.replace(/\D/g, "");
        inputs.qty.value = qtyVal;
        preview.qty.textContent = qtyVal ? `${qtyVal} pcs` : "—";
    }

    // Attach events
    Object.values(inputs).forEach(input =>
        input.addEventListener("input", updatePreview)
    );
    lenderSelect.addEventListener("change", updatePreview);
    categorySelect.addEventListener("change", updatePreview);

    updatePreview(); // initial load

    // ------------------ IMAGE PREVIEW ------------------
window.previewImage = function(event) {
    const file = event.target.files[0];
    const previewBox = document.getElementById("previewImageBox");

    if (file) {
        const imageURL = URL.createObjectURL(file);

        previewBox.src = imageURL;
        previewBox.classList.remove("hidden");

    } else {
        previewBox.src = "";
        previewBox.classList.add("hidden");
    }
};

});
</script>

   </body>
</html>
