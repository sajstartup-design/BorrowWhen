<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport"
         content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
      <meta name="robots" content="noindex, nofollow" />
      <title>Borrowhen | Dashboard</title>
      <!-- Favicon -->
      <link rel="icon" type="image/x-icon" th:href="@{/assets/logo.ico}" />
      <!-- Fonts -->
      <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <!-- Icons + CSS -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <link rel="stylesheet" th:href="@{/css/style.css}" />
      <link rel="stylesheet" th:href="@{/css/output.css}" />
   </head>
   <body>
      <div class="bg-base-200 flex min-h-screen flex-col">
         <div th:replace="~{header :: header-lender}"></div>
         <main class="flex-1 relative">
            <div class="absolute top-0 left-0 w-full h-105 bg-blue-500 z-0"></div>
            <div class="relative z-10 px-6 max-w-[1280px] mx-auto w-full gap-y-3">
               <div class="flex flex-wrap items-center justify-between">
                  <div class="max-w-auto overflow-x-auto">
                     <ul class="py-3 flex items-center text-white">
                        <li>
                           <a th:href="@{/lender/dashboard}" class="px-2 text-xs flex items-center gap-2">
                           <i class="fa-solid fa-house inline-flex items-center"></i>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a th:href="@{/lender/dashboard}" class="px-2 text-xs flex items-center gap-2">
                           <span>Borrowhen</span>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a th:href="@{/lender/inventory}" class="px-2 text-xs flex items-center gap-2">
                           <span>Inventory List</span>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a href="#" class="px-2 text-xs flex items-center gap-2 font-bold">
                           <span>Item Details</span>
                           </a>
                        </li>
                     </ul>
                  </div>
               </div>
               <hr class="border-t border-white opacity-80" />
               <div class="flex">
                  <div class="flex items-center py-4 gap-3">
                     <div class="text-base rounded-md bg-white w-10 h-10 flex items-center justify-center">
                        <i class="fa-solid fa-chart-pie text-2xl text-blue-500"></i>
                     </div>
                     <div class="flex flex-col gap-0 text-white">
                        <span class="text-lg font-bold">Item Details</span>
                     </div>
                  </div>
               </div>
               <!-- ---------- ITEM DETAILS ---------- -->
               <div class="bg-white rounded-md" th:object="${inventoryDto}">
                  <div class="bg-base-100 rounded-xl p-6 shadow-md flex flex-col gap-6">
                     <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                        <!-- LEFT SIDE — BASIC INFORMATION -->
                        <div class="xl:col-span-2 space-y-6">
                           <div class="border border-gray-200 rounded-lg p-5 shadow-md">
                              <h2 class="text-lg font-semibold text-gray-800 mb-4">Item Information</h2>
                              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                 <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">Item Name</label>
                                    <div class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm">
                                       <span th:text="*{itemName}">Sample Item</span>
                                    </div>
                                 </div>
                                 <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">Price</label>
                                    <div class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm">
                                       <span th:text="*{price}">100.00</span>
                                    </div>
                                 </div>
                                 <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">Total Qty</label>
                                    <div class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm ">
                                       <span th:text="*{totalQty}">10</span>
                                    </div>
                                 </div>
                                 <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">Available Qty</label>
                                    <div class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm ">
                                       <span th:text="*{availableQty}">5</span>
                                    </div>
                                 </div>
                              </div>
                           </div>
                        </div>
                        <!-- RIGHT SIDE — PREVIEW -->
                        <div class="space-y-6">
                           <div class="border border-gray-200 rounded-lg p-5 shadow-md">
                              <h2 class="text-lg font-semibold text-gray-800 mb-4">Item Information Preview</h2>
                              <div class="space-y-3 text-sm text-gray-600">
                                 <p><span class="font-medium">Item:</span> <span id="previewName" th:text="*{itemName}">—</span></p>
                                 <p><span class="font-medium">Price:</span> <span id="previewGender" th:text="*{price}">—</span></p>
                                 <p><span class="font-medium">Total Qty:</span> <span id="previewBirthDate" th:text="*{totalQty}">—</span></p>
                                 <p><span class="font-medium">Available Qty:</span> <span id="previewAvailable" th:text="*{availableQty}">—</span></p>
                              </div>
                           </div>
                           <!-- Back Button -->
                           <div class="flex items-center justify-end gap-3">
                              <a th:href="@{/lender/inventory}"
                                 class="h-8 px-2 py-1 rounded-md border border-gray-300 text-sm text-gray-600 hover:bg-gray-50 flex items-center gap-2">
                              <i class="fa-solid fa-arrow-left"></i>
                              Back
                              </a>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
               <footer th:replace="~{footer :: footer}"></footer>
            </div>
         </main>
      </div>
   </body>
</html>
