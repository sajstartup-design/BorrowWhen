<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport"
         content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
      <meta name="robots" content="noindex, nofollow" />
      <title>Borrowhen | Dashboard</title>
      <!-- Favicon -->
      <link rel="icon" type="image/x-icon" th:href="@{/assets/logo.ico}" />
      <!-- Fonts -->
      <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <!-- Icons + CSS -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <link rel="stylesheet" th:href="@{/css/style.css}" />
      <link rel="stylesheet" th:href="@{/css/output.css}" />
   </head>
   <body>
      <div class="bg-base-200 flex min-h-screen flex-col">
         <div th:replace="~{header :: header-lender}"></div>
         <main class="flex-1 relative">
            <div class="absolute top-0 left-0 w-full h-105 bg-blue-500 z-0">			
            </div>
            <div class="relative z-10 px-6 max-w-[1280px] mx-auto w-full gap-y-3">
               <div class="flex flex-wrap items-center justify-between">
                  <div class="max-w-auto overflow-x-auto">
                     <ul class="py-3 flex items-center text-white">
                        <li>
                           <a th:href="@{/lender/dashboard}" class="px-2 text-xs flex items-center gap-2">
                           <i class="fa-solid fa-house inline-flex items-center"></i>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a th:href="@{/lender/dashboard}" class="px-2 text-xs flex items-center gap-2">
                           <span>Borrowhen</span>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a th:href="@{/lender/inventory}" class="px-2 text-xs flex items-center gap-2 "	>
                           <span>Inventory List</span>
                           </a>
                        </li>
                        <li>
                           <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                        </li>
                        <li>
                           <a href="#" class="px-2 text-xs flex items-center gap-2 font-bold">
                           <span>Edit Item</span>
                           </a>
                        </li>
                     </ul>
                  </div>
               </div>
               <hr class="border-t border-white opacity-80" />
               <div class="flex">
                  <div class="flex items-center py-4 gap-3">
                     <div class="text-base rounded-md bg-white w-10 h-10 flex items-center justify-center">
                        <i class="fa-solid fa-chart-pie text-2xl text-blue-500" ></i>
                     </div>
                     <div class="flex flex-col gap-0 text-white">
                        <span class="text-lg font-bold">Edit Item</span>
                     </div>
                  </div>
               </div>
               <!-- ---------- FORM ---------- -->
               <div class="bg-white rounded-md ">
                  <div class="bg-base-100 rounded-xl p-6 shadow-md flex flex-col gap-6">
                     <form th:action="@{/lender/inventory/edit}" method="POST" th:object="${inventoryDto}">
                        <input type="hidden" name="encryptedId" th:value="*{encryptedId}" />
                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                           <!-- LEFT SIDE — BASIC INFORMATION -->
                           <div class="xl:col-span-2 space-y-6">
                              <div class="border border-gray-200 rounded-lg p-5 shadow-md">
                                 <h2 class="text-lg font-semibold text-gray-800 mb-4">Item Information</h2>
                                 <span id="itemInfoError" class="text-red-500 text-sm mb-2 hidden"></span>
                                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemName">Item Name</label>
                                       <input id="itemName" type="text" name="itemName" placeholder="Enter item name" required th:value="*{itemName}"
                                          class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                       <span class="error"
                                          th:if="${fieldErrors != null and fieldErrors.containsKey('itemName')}"
                                          th:text="${fieldErrors['itemName']}"></span>
                                    </div>
                                    <div>
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemPrice">Price</label>
                                       <input id="itemPrice" type="text" name="price" placeholder="100.00" required th:value="*{price}"
                                          class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                       <span class="error"
                                          th:if="${fieldErrors != null and fieldErrors.containsKey('price')}"
                                          th:text="${fieldErrors['price']}"></span>
                                    </div>
                                    <div>
                                       <label class="block text-sm font-medium text-gray-600 mb-1" for="itemQty">Total Qty</label>
                                       <input id="itemQty" type="text" name="totalQty" placeholder="10" required th:value="*{totalQty}"
                                          class="w-full border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                       <span class="error"
                                          th:if="${fieldErrors != null and fieldErrors.containsKey('totalQty')}"
                                          th:text="${fieldErrors['totalQty']}"></span>
                                    </div>
                                 </div>
                              </div>
                           </div>
                           <!-- RIGHT SIDE — PREVIEW -->
                           <div class="space-y-6">
                              <div class="border border-gray-200 rounded-lg p-5 shadow-md">
                                 <h2 class="text-lg font-semibold text-gray-800 mb-4">Item Information Preview</h2>
                                 <div class="space-y-3 text-sm text-gray-600">
                                    <p><span class="font-medium">Item:</span> <span id="previewName">—</span></p>
                                    <p><span class="font-medium">Price:</span> <span id="previewGender">—</span></p>
                                    <p><span class="font-medium">Total Qty:</span> <span id="previewBirthDate">—</span></p>
                                    <p><span class="font-medium">Available Qty:</span> <span id="previewAvailableQty">—</span></p>
                                 </div>
                              </div>
                              <!-- Buttons -->
                              <div class="flex items-center justify-end gap-3">
                                 <a th:href="@{/lender/inventory}"
                                    class="h-8 px-2 py-1 rounded-md border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">
                                 Cancel
                                 </a>
                                 <button type="submit" id="updateButton"
                                    class="h-8 px-2 py-1 rounded-md bg-blue-500 text-white text-sm hover:bg-indigo-700 transition shadow-md transitioning">
                                 <i class="fa-solid fa-check mr-2"></i>Update Item
                                 </button>
                              </div>
                           </div>
                        </div>
                     </form>
                  </div>
               </div>
               <footer th:replace="~{footer :: footer}"></footer>
            </div>
         </main>
      </div>
      <script th:src="@{/script/loading.js}"></script>
      <script th:inline="javascript">
         /*<![CDATA[*/
         document.addEventListener("DOMContentLoaded", () => {
             const totalQtyInput = document.getElementById("itemQty");
             const availableQty = parseInt(/*[[${inventoryDto.availableQty}]]*/ 0);
             const currentTotal = parseInt(/*[[${inventoryDto.totalQty}]]*/ 0);
             const borrowedQty = currentTotal - availableQty;
             const errorSpan = document.getElementById("itemInfoError");
             const updateBtn = document.getElementById("updateButton");
         
             function validateQty() {
                 const newTotal = parseInt(totalQtyInput.value);
         
                 if (isNaN(newTotal) || newTotal < borrowedQty) {
                     errorSpan.textContent = `Total Qty cannot be less than borrowed items (${borrowedQty}).`;
                     errorSpan.classList.remove("hidden");
                     updateBtn.disabled = true;
                     updateBtn.classList.add("opacity-50", "cursor-not-allowed");
                     return false;
                 }
         
                 errorSpan.classList.add("hidden");
                 updateBtn.disabled = false;
                 updateBtn.classList.remove("opacity-50", "cursor-not-allowed");
                 return true;
             }
         
             totalQtyInput.addEventListener("input", validateQty);
             validateQty();
         
             const form = document.querySelector("form");
             form.addEventListener("submit", (e) => {
                 if (!validateQty()) e.preventDefault();
             });
         });
         
         /*]]>*/
      </script>
      <script th:inline="javascript">
         document.addEventListener("DOMContentLoaded", function () {
         
           // Input fields
           const nameInput = document.getElementById("itemName");
           const priceInput = document.getElementById("itemPrice");
           const qtyInput = document.getElementById("itemQty");
         
           // Preview fields
           const previewName = document.getElementById("previewName");
           const previewPrice = document.getElementById("previewGender");
           const previewQty = document.getElementById("previewBirthDate");
           const previewAvailable = document.getElementById("previewAvailableQty");
         
           // Real values from backend
           const originalTotal = parseInt(/*[[${inventoryDto.totalQty}]]*/ 0);
           const originalAvailable = parseInt(/*[[${inventoryDto.availableQty}]]*/ 0);
         
           // Borrowed = total - available
           const borrowedQty = originalTotal - originalAvailable;
         
           function updatePreview() {
             // NAME
             previewName.textContent = nameInput.value || "—";
         
             // PRICE
             let p = priceInput.value.replace(/[^\d.]/g, "");
             priceInput.value = p;
             previewPrice.textContent = p ? `₱ ${p}` : "—";
         
             // TOTAL QTY
             let total = qtyInput.value.replace(/\D/g, "");
             qtyInput.value = total;
             previewQty.textContent = total ? `${total} pcs` : "—";
         
             // AVAILABLE QTY (AUTO UPDATE)
             if (total) {
               let newAvailable = parseInt(total) - borrowedQty;
               previewAvailable.textContent = newAvailable >= 0 ? `${newAvailable} pcs` : "0 pcs";
             } else {
               previewAvailable.textContent = "—";
             }
           }
         
           [nameInput, priceInput, qtyInput].forEach(input =>
             input.addEventListener("input", updatePreview)
           );
         
           updatePreview();
         });
      </script>
   </body>
</html>
