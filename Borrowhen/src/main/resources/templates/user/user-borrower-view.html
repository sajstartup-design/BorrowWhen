<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
      <meta name="robots" content="noindex, nofollow" />
      <title>Borrowhen | Borrower</title>
      <!-- Favicon -->
      <link rel="icon" type="image/x-icon" th:href="@{/assets/logo.ico}" />
      <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css?family=Fira+Code:wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <link rel="stylesheet" th:href="@{/css/style.css}" />
      <link rel="stylesheet" th:href="@{/css/output.css}" />
   </head>
   <body>
      <th:block th:if="${isSuccess}">
         <div th:replace="~{alert :: success}"></div>
      </th:block>
      <th:block th:if="${isError}">
         <div th:replace="~{alert :: error}"></div>
      </th:block>
      <div class="bg-base-200 flex min-h-screen flex-col">
      <!-- ---------- HEADER ---------- -->
      <div th:replace="~{header :: admin-header}"></div>
      <main class="flex-1 relative">
         <!-- Blue background section (stays fixed within main) -->
         <div class="absolute top-0 left-0 w-full h-105 bg-blue-500 z-0"></div>
         <!-- Content that appears over the blue section -->
         <div class="relative z-10 px-6 max-w-[1280px] mx-auto w-full gap-y-3">
            <div class="flex flex-wrap items-center justify-between">
               <div class="max-w-auto overflow-x-auto">
                  <ul class="py-3 flex items-center text-white">
                     <li>
                        <a th:href="@{/lender/dashboard}" class="px-2 text-xs flex items-center gap-2">
                        <i class="fa-solid fa-house inline-flex items-center"></i>
                        </a>
                     </li>
                     <li>
                        <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                     </li>
                     <li>
                        <a th:href="@{/lender/dashboard}" class="px-2 text-xs flex items-center gap-2">
                        <span>Borrowhen</span>
                        </a>
                     </li>
                     <li>
                        <i class="fa-solid fa-chevron-right fa-2xs inline-flex items-center px-1"></i>
                     </li>
                     <li>
                        <a href="#" class="px-2 text-xs flex items-center gap-2 font-bold">
                        <span>Borrower List</span>
                        </a>
                     </li>
                  </ul>
               </div>
            </div>
            <hr class="border-t border-white opacity-80" />
            <div class="flex">
               <div class="flex items-center py-4 gap-3">
                  <div class="text-base rounded-md bg-white w-10 h-10 flex items-center justify-center">
                     <i class="fa-solid fa-chart-pie text-2xl text-blue-500" ></i>
                  </div>
                  <div class="flex flex-col gap-0 text-white">
                     <span class="text-lg font-bold">Borrower List</span>
                  </div>
               </div>
            </div>
            <div class="bg-white rounded-md">
               <div class="bg-base-100 rounded-xl p-6 shadow-md flex flex-col gap-6">
                  <div class="text-gray-200 rounded-lg shadow-md flex flex-col border border-gray-300 text-gray-500">
                     <!-- Filter Header -->
                     <div class="border-b border-gray-300 p-5">
                        <h2 class="text-lg font-semibold mb-4">Filter</h2>
                        <div class="flex flex-wrap gap-4">
                           <select class="border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                              <option>Status</option>
                              <option>Scheduled</option>
                              <option>Publish</option>
                              <option>Inactive</option>
                           </select>
                           <select class="border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                              <option>Category</option>
                              <option>Household</option>
                              <option>Office</option>
                              <option>Electronics</option>
                              <option>Shoes</option>
                              <option>Accessories</option>
                              <option>Game</option>
                           </select>
                           <select class="border border-gray-300 rounded-md h-8 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                              <option>Stock</option>
                              <option>Out of Stock</option>
                              <option>In Stock</option>
                           </select>
                        </div>
                     </div>
                     <!-- Search & Actions -->
                     <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-300 p-5">
                        <!-- Search Bar -->
                        <div class="flex items-center border border-gray-300 rounded-md h-8 px-2 py-1 w-full sm:w-64">
                           <i class="fa-solid fa-magnifying-glass text-gray-500 mr-2 text-sm"></i>
                           <input
                              type="search"
                              placeholder="Search Lender"
                              class="bg-transparent focus:outline-none w-full text-sm text-gray-500 placeholder-gray-500 search"
                              />
                        </div>
                        <!-- Actions -->
                        <div class="flex items-center gap-3">
                           <select
                              class="h-8 px-2 py-1 bg-transparent border border-gray-300 rounded-md text-sm text-gray-500 focus:outline-none input-page"
                              >
                              <option>1</option>
                           </select>
                           <button
                              class="h-8 px-2 py-1 flex items-center gap-2 bg-blue-200 rounded-md text-sm text-gray-700 hover:bg-blue-300 transition"
                              >
                           <i class="fa-solid fa-upload text-gray-600 text-sm"></i>
                           Export
                           </button>
                        </div>
                     </div>
                     <!-- Table -->
                     <div class="overflow-x-auto">
                        <table class="min-w-full text-sm text-gray-300">
                           <!-- HEADER -->
                           <thead class="border-b border-gray-300">
                              <tr class="text-gray-600">
                                 <th class="py-2 px-2 text-left align-middle">
                                    <div class="flex items-center justify-center">
                                       <input type="checkbox" class="w-3 h-3 accent-indigo-500 rounded header-checkbox" />
                                    </div>
                                 </th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">LENDER</th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">EMAIL</th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">PHONE NUMBER</th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">BIRTH DATE</th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">CREATED DATE</th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">UPDATED DATE</th>
                                 <th class="py-2 px-2 text-left text-xs text-gray-500 font-bold">ACTIONS</th>
                              </tr>
                           </thead>
                           <!-- BODY -->
                           <tbody class="divide-y divide-gray-500" id="table-body">                             
                           </tbody>
                        </table>
                     </div>
                     <!-- Pagination -->
                     <div class="flex flex-wrap items-center justify-between border-t border-gray-300 p-5 text-gray-400">
                        <p id="table-info" class="text-xs">Showing 1 to 10 of 100 entries</p>
                        <div class="flex items-center gap-1 pagination">
                           <!-- Previous -->
                           <button class="px-3 py-1 text-sm rounded hover:bg-[#eef2ff] text-lg leading-none prev-btn">&laquo;</button>
                           <!-- Page Numbers -->
                           <button class="page-btn px-3 py-1 text-sm rounded hover:bg-[#eef2ff]">1</button>
                           <button class="page-btn px-3 py-1 text-sm rounded hover:bg-[#eef2ff]">2</button>
                           <button class="page-btn px-3 py-1 text-sm rounded hover:bg-[#eef2ff]">3</button>
                           <span class="px-2">...</span>
                           <button class="end-btn px-3 py-1 text-sm rounded hover:bg-[#eef2ff]">10</button>
                           <!-- Next -->
                           <button class="px-3 py-1 text-sm rounded hover:bg-[#eef2ff] text-lg leading-none next-btn">&raquo;</button>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
            <footer th:replace="~{footer :: footer}"></footer>
         </div>
      </main>
      </div>
      <div id="deleteModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 hidden">
         <!-- Modal -->
         <div class="bg-gradient-to-br from-white via-blue-50 to-blue-100 border border-blue-200 shadow-2xl rounded-2xl w-full max-w-2xl overflow-hidden animate-fade-in-up">
            <!-- Header -->
            <div class="bg-blue-500 py-3 text-center text-white font-semibold text-lg tracking-wide shadow-sm">
               DELETE CONFIRMATION
            </div>
            <!-- Body -->
            <div class="px-8 py-6 text-center space-y-4">
               <!-- Optional: Item Preview -->
               <div class="flex flex-col items-center mb-6">
                  <div class="w-32 h-32 bg-white border border-blue-200 rounded-xl shadow-md flex items-center justify-center overflow-hidden">
                     <img
                        th:src="@{/images/logo.png}"
                        alt="Item Preview"
                        class="object-contain w-12 h-12"
                        />
                  </div>
                  <!-- Item Name -->
                  <span class="mt-2 text-gray-800 font-medium text-sm" id="deleteName">
                  -
                  </span>
               </div>
               <!-- Confirmation Message -->
               <p class="text-gray-600 text-sm mb-5">
                  Are you sure you want to delete this item? This action cannot be undone.
               </p>
               <!-- Hidden Form -->
               <form id="deleteForm" th:action="@{/admin/borrowers/delete}" method="POST">
                  <input type="hidden" name="encryptedId" id="deleteEncryptedId" />
               </form>
            </div>
            <!-- Footer -->
            <div class="bg-blue-50 flex justify-end gap-3 px-8 py-4 border-t border-blue-200">
               <button
                  type="button"
                  name="cancel"
                  id="deleteCancel"
                  class="h-8 px-3 py-1 text-xs text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-100 transition flex items-center justify-center gap-2"
                  >
               <i class="fa-solid fa-xmark"></i>
               CANCEL
               </button>
               <button
                  type="submit"
                  form="deleteForm"
                  id="deleteConfirm"
                  class="h-8 px-3 py-1 text-xs text-white bg-blue-500 rounded-md hover:bg-indigo-600 transition flex items-center justify-center gap-2"
                  >
               <i class="fa-solid fa-trash"></i>
               DELETE
               </button>
            </div>
         </div>
      </div>
      <script th:src="@{/script/modal.js}"></script>
      <script th:src="@{/script/pagination.js}"></script>
      <script th:src="@{/script/loading.js}"></script>
      <script th:src="@{/script/user/borrower-api.js}"></script>
   </body>
</html>
